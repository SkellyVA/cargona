# Production bundle: pulls published images; contains no source build context.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-cargona}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-cargona_db}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [cargona_net]
  backend:
    image: ghcr.io/${CARGONA_IMAGE_OWNER:-skellyva}/cargona-api:${CARGONA_VERSION:?Set full release SHA}
    restart: unless-stopped
    environment:
      PORT: 4000
      DATA_DIR: /app/data
      STORAGE_BACKEND: ${STORAGE_BACKEND:-json}
      DATABASE_URL: postgres://${DB_USER:-cargona}:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/${DB_NAME:-cargona_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?Set SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?Set SUPERADMIN_PASSWORD}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Администратор}
      MAX_TENANTS_LIMIT: ${MAX_TENANTS_LIMIT:-0}
      ENABLE_NOOR_CLUB: ${ENABLE_NOOR_CLUB:-false}
      ENABLE_NOOR_CLUB_TENANTS: ${ENABLE_NOOR_CLUB_TENANTS:-}
      ALLOWED_LOYALTY_TENANTS: ${ALLOWED_LOYALTY_TENANTS:-}
    depends_on:
      postgres: {condition: service_healthy}
    volumes: [./data/backend:/app/data]
    ports: ['127.0.0.1:4000:4000']
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:4000/health/ready",{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    networks: [cargona_net]
  frontend:
    image: ghcr.io/${CARGONA_IMAGE_OWNER:-skellyva}/cargona-web:${CARGONA_VERSION:?Set full release SHA}
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    ports: ['127.0.0.1:8080:80']
    networks: [cargona_net]
  bot:
    image: ghcr.io/${CARGONA_IMAGE_OWNER:-skellyva}/cargona-bot:${CARGONA_VERSION:?Set full release SHA}
    restart: unless-stopped
    environment:
      API_URL: http://backend:4000/api
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      WEBAPP_URL: ${WEBAPP_URL:-https://${APP_DOMAIN}/o/noor/app}
    depends_on:
      backend: {condition: service_healthy}
    networks: [cargona_net]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?Set SUPERADMIN_EMAIL}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy_data:/data
      - ./data/caddy_config:/config
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_started}
    networks: [cargona_net]
networks:
  cargona_net:
    driver: bridge
